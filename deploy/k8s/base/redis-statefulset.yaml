# Single-instance Redis. Stateful because we want the data to survive a pod
# restart (Streams + reduced state live here). For production HA use a
# real Redis operator or the Bitnami chart; this is deliberately minimal
# and easy to reason about.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: event-watch-redis
  labels:
    app.kubernetes.io/name: event-watch-redis
    app.kubernetes.io/component: redis
spec:
  serviceName: event-watch-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: event-watch-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: event-watch-redis
        app.kubernetes.io/component: redis
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args:
            - "redis-server"
            - "--appendonly"
            - "yes"
            - "--maxmemory-policy"
            - "noeviction"     # events + state are load-bearing; don't let Redis silently drop keys
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
